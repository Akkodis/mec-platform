global:
  mecplatform:
    hostname: akkodismec.francecentral.cloudapp.azure.com
    borker:
      username: "5gmeta-platform"
      password: "5gmeta-platform"
      admin:
        username: "admin"
        password: "admin-2024-2025."
    db:
      rootuser: "root"
      rootpassword: &rootpassword  "5gmeta-platform"
      username: "5gmeta-mec-platform"
      password: "5gmeta-mec-platform"
      ip: "10.2.0.5"
        
mysql-innodbcluster:
  name: mysql-cluster
  tls:
    useSelfSigned: true
  credentials:
    root:
      user: root
      password: *rootpassword
      host: "%"

apisix:
  fullnameOverride: "apisix"
  control:
    enabled: false
  etcd:
    enabled: false
  service:
    type: NodePort
  ingress:
    enabled: true
    hosts: 
       - hosts: akkodismec.francecentral.cloudapp.azure.com
         paths:
           - "/"
    className: "nginx"
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
      nginx.ingress.kubernetes.io/proxy-buffering: "on"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-busy-buffers-size: 256k
      cert-manager.io/issuer: letsencrypt-prod

    extraVolumes:
      - name: routes
        configMap:
          name: apisix-routes
    extraVolumeMounts:
      - name: routes
        mountPath: /usr/local/apisix/conf/apisix.yaml
        subPath: apisix.yaml
