# Default values for edgeinstanceapi-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: damadouk/edgeinstance-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "dev"

#imagePullSecrets: []
#imagePullSecrets:
#  - name: regcred
nameOverride: ""
fullnameOverride: "edgeinstance-api"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5000
  nodePort: 5000
  clusterIP: ""
  loadBalancerIP: ""

ingress:
  enabled: false
  className: "nginx"
  annotations: 
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: example.com
      paths:
        - path: /edgeinstance-api/*
          pathType: ImplementationSpecific
  tls: 
    - secretName: ngui-cert
      hosts:
        - example.com

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

env:
  - name: db_host
    value: "mariadb-cluster.osm.svc.cluster.local"
  - name: db_user
    valueFrom:
      secretKeyRef:
        name: mariadb
        key: username
  - name: db_root_password
    valueFrom:
      secretKeyRef:
        name: mariadb
        key: root-password
  - name: db_name
    valueFrom:
      secretKeyRef:
        name: mariadb
        key: database
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: cloud-database-access
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: cloud-database-access
        key: password
  - name: OSM_USER
    valueFrom:
      secretKeyRef:
        name: osm-user-secret
        key: username
  - name: OSM_PASSWORD
    valueFrom:
      secretKeyRef:
        name: osm-user-secret
        key: password
  - name: OSM_PROJECT_ID
    valueFrom:
      secretKeyRef:
        name: osm-user-secret
        key: project-id
  - name: DB_IP
    valueFrom:
      secretKeyRef:
        name: cloud-database-access
        key: ip
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: cloud-database-access
        key: port
  - name: DB_NAME
    value: dataflowdb
  - name: DATAFLOW_VEHICLE_MINUTES_LIMIT
    value: "1"
  - name: DATAFLOW_INFRASTRUCTURE_MINUTES_LIMIT
    value: "5"
  - name: INTROSPECTION_HOST
    value: ""
  - name: KUBERNETES_HOST
    value: ""
  - name: ORCHESTRATION_HOST
    value: "nbi.osm.svc.cluster.local:9999"
  - name: nodeip
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
