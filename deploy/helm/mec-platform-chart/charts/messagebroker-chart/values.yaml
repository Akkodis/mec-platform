# Default values for messagebroker-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: apache/activemq-classic
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

#imagePullSecrets: []
#imagePullSecrets:
#  - name: regcred
nameOverride: ""
fullnameOverride: "message-broker"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  amqp-port: 5672
  amqp-nodePort: 30672
  ui-port: 8161
  ui-nodePort: 30161
  external-port: 61616
  external-nodePort: 30616

ingress:
  enabled: false
  className: ""
  annotations: 
     kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

env:
  - name: ACTIVEMQ_CONNECTION_USER
    value: "{{ .Values.global.mecplatform.broker.username }}"
  - name: ACTIVEMQ_CONNECTION_PASSWORD
    value: "{{ .Values.global.mecplatform.broker.password }}"
  - name: ACTIVEMQ_JMX_USER
    value: "{{ .Values.global.mecplatform.broker.username }}"
  - name: ACTIVEMQ_JMX_PASSWORD
    value: "{{ .Values.global.mecplatform.broker.password }}"
  - name: ACTIVEMQ_WEB_USER
    value: "{{ .Values.global.mecplatform.broker.admin.username }}"
  - name: ACTIVEMQ_WEB_PASSWORD
    value: "{{ .Values.global.mecplatform.broker.admin.password }}"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
